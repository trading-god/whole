packages:
  - 'packages/*'
# Supply-chain guard: a version must be published for this many minutes before
# pnpm will resolve it, transitive dependencies included. 1440 is pnpm v11's
# default — stated explicitly because it is the setting a same-day Expo patch
# release collides with, and a reader hitting
# ERR_PNPM_NO_MATURE_MATCHING_VERSION needs to find the cause here rather than
# infer it from a missing line.
#
# Exceptions go in `minimumReleaseAgeExclude` and are TEMPORARY: the only reason
# to add one is that a package published today fails resolution outright. Delete
# the entry on the next dependency bump — a stale exclusion never errors, it just
# pins that package to the version named in it, which is how
# @expo/metro-runtime got stranded three patch releases behind.
minimumReleaseAge: 1440
allowBuilds:
  esbuild: true
  unrs-resolver: true
patchedDependencies:
  expo-mlkit-ocr@0.2.7: patches/expo-mlkit-ocr@0.2.7.patch
