packages:
  - 'packages/*'
# Supply-chain guard: a version must be published for this many minutes before
# pnpm will resolve it, transitive dependencies included. 1440 is pnpm v11's
# default — stated explicitly because it is the setting a same-day Expo patch
# release collides with, and a reader hitting
# ERR_PNPM_NO_MATURE_MATCHING_VERSION needs to find the cause here rather than
# infer it from a missing line.
#
# Exceptions go in `minimumReleaseAgeExclude` and are TEMPORARY: the only reason
# to add one is that a package published today fails resolution outright. Delete
# the entry on the next dependency bump — a stale exclusion never errors, it just
# pins that package to the version named in it, which is how
# @expo/metro-runtime got stranded three patch releases behind.
minimumReleaseAge: 1440
# Lifecycle scripts this repo permits. CI installs with `--ignore-scripts` —
# none of its gates need a native artifact — so these run on developer machines
# and native builds only.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # node-llama-cpp's postinstall downloads its prebuilt llama.cpp binaries for
  # this platform. Only the ocr-eval harness (devDependency) uses it.
  node-llama-cpp: true
  # llama.rn's postinstall downloads the prebuilt llama.cpp artifacts that its
  # CocoaPods spec and Android build link against — without it, pod install and
  # gradle both fail to find the sources.
  llama.rn: true
patchedDependencies:
  '@kesha-antonov/react-native-background-downloader@4.6.2': patches/@kesha-antonov__react-native-background-downloader@4.6.2.patch
  expo-media-viewer@0.7.2: patches/expo-media-viewer@0.7.2.patch
  expo-mlkit-ocr@0.2.7: patches/expo-mlkit-ocr@0.2.7.patch
  llama.rn@0.12.9: patches/llama.rn@0.12.9.patch
